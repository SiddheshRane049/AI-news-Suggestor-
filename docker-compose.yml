services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_news_backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_news_frontend
    env_file:
      - frontend/.env
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
